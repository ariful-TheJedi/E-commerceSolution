deptrac:
  paths:
    - ./app
    - ./packages
    - ./frontend
    - ./modules
  exclude_files:
    - '#.*[Tt]est.*#'
  layers:
    - name: Shared
      collectors:
        - type: directory
          value: packages/shared/src/.*
    - name: Platform
      collectors:
        - type: directory
          value: packages/platform/src/.*
    - name: Host
      collectors:
        - type: directory
          value: app/.*
    - name: Frontend
      collectors:
        - type: directory
          value: frontend/.*
    - name: Laravel
      collectors:
        - type: classNameRegex
          value: '#^Illuminate\\#'
        - type: classNameRegex
          value: '#^Symfony\\Component\\HttpFoundation\\#'
        - type: classNameRegex
          value: '#^Symfony\\Component\\Uid\\#'
    - name: ProductDomain
      collectors:
        - type: directory
          value: modules/product/src/Domain/.*
    - name: ProductContracts
      collectors:
        - type: directory
          value: modules/product/src/Contracts/.*
    - name: ProductApplication
      collectors:
        - type: directory
          value: modules/product/src/Application/.*
    - name: ProductInfrastructure
      collectors:
        - type: directory
          value: modules/product/src/Infrastructure/.*
    - name: ProductApi
      collectors:
        - type: directory
          value: modules/product/src/Api/.*
    - name: ProductProvider
      collectors:
        - type: classNameRegex
          value: '#^Modules\\Product\\ProductServiceProvider$#'
  ruleset:
    Shared: []
    Platform:
      - Shared
      - Laravel
    Host:
      - Shared
      - Platform
      - Laravel
    Frontend:
      - Shared
      - Laravel
    ProductDomain: []
    ProductContracts: []
    ProductApplication:
      - ProductDomain
      - ProductContracts
      - Shared
    ProductInfrastructure:
      - ProductDomain
      - ProductApplication
      - ProductContracts
      - Shared
      - Platform
      - Laravel
    ProductApi:
      - ProductApplication
      - ProductDomain
      - Shared
      - Laravel
    ProductProvider:
      - ProductApplication
      - ProductInfrastructure
      - ProductContracts
      - Shared
      - Laravel
